searchd {
  listen = 9306:mysql41
  listen = 9308:http
  log = /var/lib/manticore/searchd.log
  query_log = /var/lib/manticore/query.log
  pid_file = /var/run/manticore/searchd.pid
}

index torrents_rt {
  type = rt
  path = /var/lib/manticore/torrents_rt
  rt_field = name
  rt_attr_string = infohash
  rt_attr_bigint = size_total
  rt_attr_timestamp = created_at
  morphology = jieba_chinese
  jieba_user_dict_path = /etc/manticoresearch/jieba_user_dict.txt
  charset_table = non_cjk, U+4E00..U+9FFF, U+3400..U+4DBF, U+20000..U+2A6DF, U+2A700..U+2B73F, U+2B740..U+2B81F, U+2B820..U+2CEAF
}
